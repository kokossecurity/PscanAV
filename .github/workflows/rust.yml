
name: PscanAV Auto Compiler

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile PscanAV for Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Check code
        run: cargo check --all-targets

      - name: Compile executable
        run: cargo build --release

      - name: Place executable in repository
        run: |
          mkdir -p bin
          cp target/release/pscanav bin/pscanav
          chmod 755 bin/pscanav

      - name: Commit executable
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/pscanav
          if ! git diff --cached --quiet; then
            git commit -m "Update precompiled Linux executable"
            git push
          fi
