
name: PscanAV Linux Build

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Linux x86_64 binary
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Check Rust code
        run: cargo check --all-targets

      - name: Build optimized executable
        run: cargo build --release

      - name: Package executable
        run: |
          chmod +x target/release/pscanav
          tar -czf PscanAV-linux-x86_64.tar.gz -C target/release pscanav

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PscanAV-linux-x86_64
          path: PscanAV-linux-x86_64.tar.gz
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PscanAV-linux-x86_64.tar.gz
          generate_release_notes: true
